worker_processes auto;
events { worker_connections 1024; }

http {
  # ---- Global prod rate limit (single shared bucket) ----
  # Strict 1 r/s to prod. All prod-bound requests (search + fallback) share one
  # bucket because MB's rate limit applies to musicbrainz.org as a whole,
  # regardless of which gateway path triggered the request.
  # Queueing (not dropping) is enforced at the location-level via `burst=N`
  # *without* nodelay. The mirror path has no limit_req at all → unlimited.
  map "" $prod_key { default prod; }
  limit_req_zone $prod_key zone=prod_rate:10m rate=1r/s;

  # ---- Log format -----------------------------------------------------------
  # gw_status        : final status returned to the client by the gateway
  # req_time         : total time spent in the gateway (seconds)
  # upstream_addr    : address(es) of upstream(s) contacted; comma-separated if
  #                    a fallback happened (e.g. "172.17.0.1:5000, 130.185.127.84:443")
  # upstream_status  : status(es) from upstream(s); also comma-separated on fallback
  # upstream_connect : TCP connect time(s) to upstream(s)
  # upstream_resp    : full response time(s) from upstream(s)
  # served / decision: from the X-Gateway-Served-From / X-Gateway-Decision headers
  log_format mb '$remote_addr - [$time_local] "$request" '
                'gw_status=$status req_time=$request_time '
                'upstream_addr="$upstream_addr" upstream_status="$upstream_status" '
                'upstream_connect="$upstream_connect_time" upstream_resp="$upstream_response_time" '
                'ct="$content_type" uct="$upstream_http_content_type" '
                'served="$sent_http_x_gateway_served_from" decision="$sent_http_x_gateway_decision" '
                'bytes=$body_bytes_sent';

  access_log /var/log/nginx/access.log mb;
  error_log  /var/log/nginx/error.log  warn;

  # ---- Detect search (presence of ?query=...) without 'if' + limit_req together ----
  map $arg_query $is_search {
    default 0;
    ""      0;
    ~.+     1;
  }

  # ---- Upstreams ----
  upstream mb_mirror { server host.docker.internal:5000; keepalive 32; }
  upstream mb_prod   { server musicbrainz.org:443;       keepalive 32; }

  server {
    listen 80;
    server_name _;

    # Upstream negotiation: JSON only, no compression
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header User-Agent "MB-Gateway/NGINX (contact: you@example.com)";
    proxy_set_header Accept "application/json";
    proxy_set_header Accept-Encoding "";

    # Fail fast so a dead mirror triggers the prod fallback quickly.
    proxy_connect_timeout 3s;
    proxy_read_timeout    30s;
    proxy_send_timeout    30s;

    add_header X-Gateway-Version "nginx-plain-1.3" always;

    # ----- All WS/2 traffic -----
    # Normalize old/short WS paths to WS/2 so they hit the proxy logic.
    location ^~ /ws/ {
      rewrite ^/ws/(.*)$ /ws/2/$1 last;
    }

    location ^~ /ws/2/ {

      # If this is a search, do an internal redirect to @search
      # (the 418 trick avoids limit_req-inside-if, which nginx forbids).
      error_page 418 = @search;
      if ($is_search) { return 418; }

      # Lookup/Browse → mirror first.
      # Fall back to prod on ANY of:
      #   - mirror returns 404            (entity not present in mirror)
      #   - mirror returns 5xx            (mirror process broken)
      #   - nginx can't connect / times out → it synthesizes 502 or 504,
      #     which error_page also catches → fallback
      proxy_intercept_errors on;
      error_page 404 500 502 503 504 = @prod_fallback;

      proxy_pass http://mb_mirror;

      add_header X-Gateway-Decision "lookup-or-browse" always;
      add_header X-Gateway-Served-From "mirror" always;
      add_header X-Upstream-Status $upstream_status always;
    }

    # ----- SEARCH → PROD (rate-limited, queued) -----
    location @search {
      # burst=20 without nodelay: queue up to 20 over-rate requests, release
      # them at exactly 1 r/s. 21st queued request gets 503.
      limit_req zone=prod_rate burst=20;
      proxy_ssl_server_name on;
      proxy_set_header Host musicbrainz.org;
      proxy_pass https://mb_prod;

      add_header X-Gateway-Decision "search" always;
      add_header X-Gateway-Served-From "prod" always;
      add_header X-Upstream-Status $upstream_status always;
    }

    # ----- Mirror failure → PROD fallback (rate-limited, queued) -----
    # Reached when the mirror 404s, errors, or is unreachable.
    location @prod_fallback {
      limit_req zone=prod_rate burst=20;
      proxy_ssl_server_name on;
      proxy_set_header Host musicbrainz.org;
      proxy_pass https://mb_prod;

      add_header X-Gateway-Decision "lookup-or-browse" always;
      add_header X-Gateway-Served-From "prod-fallback" always;
      add_header X-Upstream-Status $upstream_status always;
    }

    # ----- JSON error bodies from gateway (no HTML) -----
    # These only fire if BOTH mirror and prod fail (or prod fails on a search).
    # Note: rate-limit rejections (503 from limit_req) also land here.
    proxy_intercept_errors on;
    error_page 400 = /__err_400.json;
    error_page 500 502 503 504 = /__err_50x.json;

    location = /__err_400.json { default_type application/json; return 400 '{"error":"Bad Request"}'; }
    location = /__err_50x.json { default_type application/json; return 502 '{"error":"Gateway error"}'; }
  }
}
